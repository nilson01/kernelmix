name: Package checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
            minimum: true
          - os: ubuntu-latest
            python: '3.14'
            minimum: false
          - os: windows-latest
            python: '3.13'
            minimum: false
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install build twine ruff
      - if: matrix.minimum
        run: python -m pip install numpy==1.24.0 scipy==1.10.0 matplotlib==3.7.0 pytest==7.4.0
      - if: ${{ !matrix.minimum }}
        run: python -m pip install numpy scipy matplotlib pytest
      - run: python -m ruff check src tests tools
      - run: python tools/check_public.py
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install wheel
        shell: python
        run: |
          import glob, subprocess, sys
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', glob.glob('dist/*.whl')[0]])
      - name: Install coverage tool
        if: runner.os == 'Linux' && matrix.python == '3.14'
        run: python -m pip install 'coverage>=7.10,<8'
      - name: Test installed distribution outside checkout
        env:
          COLLECT_COVERAGE: ${{ runner.os == 'Linux' && matrix.python == '3.14' && '1' || '' }}
        shell: python
        run: |
          import os, pathlib, shutil, subprocess, sys, tempfile
          root = pathlib.Path.cwd()
          with tempfile.TemporaryDirectory() as folder:
              dest = pathlib.Path(folder)
              shutil.copytree(root/'tests', dest/'tests')
              shutil.copytree(root/'tools', dest/'tools')
              subprocess.check_call([sys.executable, '-c', 'import kernelmix; print(kernelmix.__file__)'], cwd=dest)
              measure = os.environ.get('COLLECT_COVERAGE') == '1'
              runner = ['coverage', 'run', '--branch', '--source=kernelmix', '-m', 'pytest'] if measure else ['pytest']
              subprocess.run([sys.executable, '-m', *runner, *['tests', '-q', '--junitxml=results.xml']], cwd=dest, check=True)
              if measure:
                  report = pathlib.Path(os.environ['RUNNER_TEMP']) / 'coverage'
                  report.mkdir(exist_ok=True)
                  subprocess.run([sys.executable, '-m', 'coverage', 'xml', '-o', str(report / 'coverage.xml'), '--fail-under=1'], cwd=dest, check=True)
                  with (report / 'coverage.txt').open('w') as output:
                      subprocess.run([sys.executable, '-m', 'coverage', 'report', '-m'], cwd=dest, stdout=output, check=True)
                  print((report / 'coverage.txt').read_text())
      - name: Save test coverage report
        if: always() && runner.os == 'Linux' && matrix.python == '3.14'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-coverage
          path: ${{ runner.temp }}/coverage/
          if-no-files-found: error
          retention-days: 14
