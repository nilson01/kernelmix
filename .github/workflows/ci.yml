name: Package checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
            minimum: true
          - os: ubuntu-latest
            python: '3.14'
            minimum: false
          - os: windows-latest
            python: '3.13'
            minimum: false
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install build twine ruff
      - if: matrix.minimum
        run: python -m pip install numpy==1.24.0 scipy==1.10.0 matplotlib==3.7.0 pytest==7.4.0
      - if: ${{ !matrix.minimum }}
        run: python -m pip install numpy scipy matplotlib pytest
      - run: python -m ruff check src tests tools
      - run: python tools/check_public.py
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install wheel
        shell: python
        run: |
          import glob, subprocess, sys
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', glob.glob('dist/*.whl')[0]])
      - name: Test installed distribution outside checkout
        shell: python
        run: |
          import os, pathlib, shutil, subprocess, sys, tempfile
          root = pathlib.Path.cwd()
          with tempfile.TemporaryDirectory() as folder:
              dest = pathlib.Path(folder)
              shutil.copytree(root/'tests', dest/'tests')
              shutil.copytree(root/'tools', dest/'tools')
              subprocess.check_call([sys.executable, '-c', 'import kernelmix; print(kernelmix.__file__)'], cwd=dest)
              subprocess.check_call([sys.executable, '-m', 'pytest', 'tests', '-q', '--junitxml=results.xml'], cwd=dest)
